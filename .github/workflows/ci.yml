name: rules-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile main sources
        run: |
          mkdir -p build/main
          javac -Xlint:all -Werror -d build/main $(find src/main/java -name '*.java' -print)
      - name: Compile tests
        run: |
          mkdir -p build/test
          javac -Xlint:all -Werror -cp build/main -d build/test $(find src/test/java -name '*.java' -print)
      - name: Run tests
        run: java -cp build/main:build/test com.skycoin4444.rules.RuleEngineTest
      - name: Build runnable jar
        run: jar --create --file build/sky-rules.jar --main-class com.skycoin4444.rules.RuleCli -C build/main .
      - name: Smoke test jar
        run: test "$(java -jar build/sky-rules.jar 150)" = "example-high-value:review"
      - name: Build image
        run: docker build -t sky-rules:ci .
      - name: Verify non-root image
        run: test "$(docker run --rm --entrypoint=id sky-rules:ci -u)" != "0"
